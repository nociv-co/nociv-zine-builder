<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Zine Builder: NOCIV.CO</title>
<meta name="description" content="Make a zine on your phone. Photos, words, drawings, stickers. Print it on one sheet and fold it, or make a stapled booklet. Free from NOCIV.CO.">
<style>
  @font-face { font-family: 'ZMarker'; src: url('fonts/permanentmarker.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZElite'; src: url('fonts/specialelite.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZCourier'; src: url('fonts/courierprime.woff') format('woff'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'ZRock'; src: url('fonts/rocksalt.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZAnton'; src: url('fonts/anton.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZBungee'; src: url('fonts/bungee.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZShrik'; src: url('fonts/shrikhand.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'ZAbril'; src: url('fonts/abrilfatface.woff') format('woff'); font-display: swap; }
  :root { --paper: #efece5; --note: #f8f4e8; --ink: #1d1c1a; --soft: #6a6458; --line: #d9d2c2; --red: #c8412f; --sel: #2d6cf6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  html { touch-action: pan-x pan-y; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 980px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; padding-top: max(8px, env(safe-area-inset-top)); }
  .brand { font-weight: 900; letter-spacing: .06em; font-size: 0.95rem; white-space: nowrap; }
  .brand span { background: var(--ink); color: #fff; padding: 1px 7px; border-radius: 5px; margin-right: 5px; }
  .ttl { flex: 1; min-width: 0; font-size: 0.82rem; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--ink); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ic:disabled { opacity: .35; }
  .ic svg { width: 18px; height: 18px; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 12px 8px; }
  .tab { border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 4px; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
  .tab b { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--paper); font-size: 0.7rem; margin-right: 4px; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tab[aria-selected="true"] b { background: var(--red); color: #fff; }

  .toolbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar, .row::-webkit-scrollbar, .thumbs::-webkit-scrollbar { display: none; }
  .tool { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 7px 8px 5px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 0.7rem; font-weight: 800; letter-spacing: .03em; }
  .tool svg { width: 22px; height: 22px; }
  .tool[aria-expanded="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .tool .chev { font-size: 0.6rem; opacity: .6; }

  .drawer { background: var(--note); border-radius: 14px; margin: 0 12px 8px; padding: 10px 0 6px; box-shadow: 0 3px 12px rgba(40,30,10,.08); max-height: 34vh; max-height: 34dvh; overflow-y: auto; overscroll-behavior: contain; }
  .drawer[hidden] { display: none; }
  .dlabel { font-size: 0.66rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); padding: 0 12px; margin: 2px 0 5px; }
  .row { display: flex; gap: 7px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; align-items: center; }
  .chip { flex: none; border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 8px 13px; font-weight: 700; font-size: 0.84rem; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip.go { background: var(--red); border-color: var(--red); color: #fff; }
  .chip.warn { border-color: var(--red); color: var(--red); }
  .dot { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; padding: 0; }
  .dot[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--ink); }
  .dot.custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .dot.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .tile { flex: none; width: 74px; height: 74px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 4px; }
  .tile canvas { width: 62px; height: 62px; }
  .tile[aria-pressed="true"] { border-color: var(--ink); }
  .ta { margin: 0 12px 8px; display: block; width: calc(100% - 24px); min-height: 64px; border: 1.5px solid var(--ink); border-radius: 10px; padding: 9px 11px; font-size: 16px; background: #fff; resize: vertical; }
  .lbl-in { flex: none; width: 150px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 16px; background: #fff; }

  .stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 6px 46px; }
  .pagewrap { position: relative; touch-action: none; box-shadow: 0 10px 28px rgba(40,30,10,.22); border-radius: 2px; background: #fff; }
  .pagewrap canvas { display: block; width: 100%; height: 100%; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 64px; border: none; background: rgba(255,255,255,.7); border-radius: 12px; cursor: pointer; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
  .nav:disabled { opacity: .2; }
  .nav.prev { left: 4px; } .nav.next { right: 4px; }
  .pname { position: absolute; top: 2px; left: 14px; font-size: 0.68rem; font-weight: 800; letter-spacing: .1em; color: var(--soft); text-transform: uppercase; }
  #sel { position: absolute; border: 1.5px dashed var(--sel); pointer-events: none; transform-origin: center; }
  #sel[hidden] { display: none; }
  #sel i { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid var(--sel); pointer-events: auto; touch-action: none; }
  #sel .hs { right: -14px; bottom: -14px; cursor: nwse-resize; }
  #sel .hr { left: 50%; top: -40px; margin-left: -13px; cursor: grab; }
  #sel .hr::after { content: ''; position: absolute; left: 11px; top: 24px; width: 1.5px; height: 14px; background: var(--sel); }
  .drawing .pagewrap { outline: 3px solid var(--red); }

  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); scrollbar-width: none; }
  .th { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border: none; background: none; padding: 0; }
  .th canvas { width: 42px; height: 65px; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.18); outline: 2px solid transparent; outline-offset: 2px; }
  .th[aria-current="true"] canvas { outline-color: var(--red); }
  .th span { font-size: 0.62rem; font-weight: 800; color: var(--soft); }

  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 30px; }
  .card { background: var(--note); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 12px rgba(40,30,10,.08); }
  .card h3 { margin: 0 0 10px; font-size: 0.85rem; letter-spacing: .08em; text-transform: uppercase; }
  .fmt { display: grid; gap: 10px; }
  .fmtbtn { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .fmtbtn b { display: block; font-size: 0.95rem; }
  .fmtbtn span { font-size: 0.84rem; color: var(--soft); }
  .fmtbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 4px; }
  .field input { width: 100%; border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 16px; background: #fff; }
  .wide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .big { width: 100%; border: none; border-radius: 12px; background: var(--red); color: #fff; font-weight: 900; letter-spacing: .06em; padding: 15px; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 12px rgba(200,65,47,.25); }
  .big:disabled { opacity: .55; }
  .muted { font-size: 0.84rem; color: var(--soft); line-height: 1.45; }
  ol.steps { padding-left: 20px; margin: 6px 0 0; font-size: 0.9rem; line-height: 1.45; }
  ol.steps li { margin-bottom: 7px; }
  .sheets { display: grid; gap: 10px; }
  .sheets figure { margin: 0; }
  .sheets canvas { width: 100%; height: auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .sheets figcaption { font-size: 0.75rem; font-weight: 800; color: var(--soft); margin-top: 4px; }
  .file { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; margin-top: 8px; }
  .file span { flex: 1; font-size: 0.88rem; font-weight: 700; }
  .file button { border: none; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 900; font-size: 0.78rem; padding: 10px 14px; cursor: pointer; text-transform: uppercase; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; z-index: 20; pointer-events: none; }
  [hidden] { display: none !important; }
  @media (min-width: 760px) { .stage { padding: 10px 70px; } .nav { width: 50px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span>ZINE</span>BUILDER</div>
    <div class="ttl" id="ttl"></div>
    <button class="ic" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="ic" id="redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-step="setup" aria-selected="false"><b>1</b>Set up</button>
    <button class="tab" role="tab" data-step="make" aria-selected="true"><b>2</b>Make</button>
    <button class="tab" role="tab" data-step="print" aria-selected="false"><b>3</b>Print</button>
  </nav>

  <!-- MAKE -->
  <div id="makeView" style="display:contents">
    <div class="toolbar" id="toolbar"></div>
    <div class="drawer" id="drawer" hidden></div>
    <div class="stage" id="stage">
      <span class="pname" id="pname"></span>
      <button class="nav prev" id="prev" aria-label="Previous page">&lsaquo;</button>
      <div class="pagewrap" id="pagewrap"><canvas id="page"></canvas><div id="sel" hidden><i class="hr" data-h="rot"></i><i class="hs" data-h="scale"></i></div></div>
      <button class="nav next" id="next" aria-label="Next page">&rsaquo;</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <!-- SET UP -->
  <div class="panel" id="setupView" hidden>
    <div class="card">
      <h3>What kind of zine?</h3>
      <div class="fmt">
        <button class="fmtbtn" data-fmt="mini"><b>Mini zine</b><span>One sheet of paper, 8 little pages, one cut, no staples. The classic.</span></button>
        <button class="fmtbtn" data-fmt="booklet"><b>Booklet</b><span>Bigger half-letter pages, folded and stapled. 8 to 24 pages.</span></button>
      </div>
      <div id="countBox" hidden>
        <div class="field"><label>Pages</label></div>
        <div class="wide" id="counts"></div>
      </div>
    </div>
    <div class="card">
      <h3>About it</h3>
      <div class="field"><label for="fTitle">Title</label><input id="fTitle" maxlength="60" placeholder="Untitled"></div>
      <div class="field"><label for="fNum">Issue number</label><input id="fNum" maxlength="10" placeholder="001"></div>
      <div class="field"><label for="fBy">By</label><input id="fBy" maxlength="60" placeholder="Your name"></div>
      <p class="muted">Your zine saves on this phone by itself. Save a copy to move it to another device.</p>
      <div class="wide">
        <button class="chip" id="saveCopy">Save a copy</button>
        <label class="chip" style="position:relative;overflow:hidden">Open a copy<input type="file" id="openCopy" accept=".json,application/json" style="position:absolute;inset:0;opacity:0"></label>
        <button class="chip warn" id="fresh">Start a new zine</button>
      </div>
    </div>
    <button class="big" data-goto="make">Start making &rarr;</button>
  </div>

  <!-- PRINT -->
  <div class="panel" id="printView" hidden>
    <div class="card">
      <h3>Your print sheet</h3>
      <div class="sheets" id="sheets"></div>
      <p class="muted" id="emptyWarn"></p>
    </div>
    <div class="card">
      <h3>Get the files</h3>
      <button class="big" id="make">Make my PDF</button>
      <p class="muted" id="working" hidden>Putting your pages together...</p>
      <div id="files"></div>
      <p class="muted">Print at <b>100%</b> or <b>Actual size</b>, not "Fit to page".</p>
    </div>
    <div class="card">
      <h3>How to fold it</h3>
      <ol class="steps" id="foldSteps"></ol>
    </div>
  </div>
</div>
<input type="file" id="photoIn" accept="image/*" hidden>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // The page itself never zooms (the zine page has its own pinch), so nobody gets stuck zoomed in.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  var R = 4.25 / 2.75; // page height / width. Same shape for mini (2.75 x 4.25) and booklet (5.5 x 8.5)

  // =========================================================
  // FONTS, COLORS, LISTS
  // =========================================================
  var SYS = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  var FONTS = {
    tall: { n: 'Tall', css: 'ZAnton', lh: 1.04 },
    marker: { n: 'Marker', css: 'ZMarker', lh: 1.12 },
    type: { n: 'Typewriter', css: 'ZElite', lh: 1.2 },
    courier: { n: 'Courier', css: 'ZCourier', w: '700', lh: 1.15 },
    hand: { n: 'Scrawl', css: 'ZRock', lh: 1.55 },
    block: { n: 'Block', css: 'ZBungee', lh: 1.05 },
    retro: { n: 'Retro', css: 'ZShrik', lh: 1.15 },
    fancy: { n: 'Fancy', css: 'ZAbril', lh: 1.08 },
    plain: { n: 'Plain', css: SYS, w: '800', lh: 1.1 }
  };
  var RANSOM = ['tall', 'marker', 'type', 'courier', 'block', 'retro', 'fancy', 'plain'];
  var INKS = ['#1d1c1a', '#ffffff', '#c8412f', '#2d4fd6', '#2f7a4b', '#f2c230', '#ff4fb4', '#f2994a', '#8a8478'];
  var PAPERS = [['#ffffff', 'White'], ['#f6eedb', 'Cream'], ['#e6e2d8', 'Newsprint'], ['#c9a77c', 'Kraft'], ['#f4c6c6', 'Pink'], ['#f3df7a', 'Yellow'], ['#bcd8e8', 'Sky'], ['#1a1918', 'Black']];
  var TEXTURES = [['none', 'Plain'], ['grid', 'Grid'], ['lined', 'Lined'], ['dots', 'Dots'], ['grain', 'Grain']];
  var STICKERS = [['tape', 'Tape', 0.26], ['washi', 'Washi', 0.22], ['burst', 'Burst', 1], ['stamp', 'Stamp', 0.42], ['arrow', 'Arrow', 0.55], ['circle', 'Circle it', 0.62], ['squiggle', 'Underline', 0.2], ['star', 'Star', 1], ['sparkle', 'Sparkle', 1], ['heart', 'Heart', 0.9], ['xmark', 'X', 1], ['smile', 'Smile', 1], ['barcode', 'Barcode', 0.45], ['staple', 'Staple', 0.22], ['dotblob', 'Dots', 1]];
  var LABELS = ['NEW', 'FREE', 'YES', 'WOW', 'DIY', 'PASS IT ON', 'HANDMADE', 'LIMITED', 'NO ADS', 'LOCAL'];
  var LAYOUTS = [
    ['Full photo', function () { return [{ t: 'slot', x: 0.5, y: R / 2, w: 1, ar: R, rot: 0 }]; }],
    ['Photo and words', function () { return [{ t: 'slot', x: 0.5, y: R * 0.36, w: 0.84, ar: 0.95, rot: 0 }, { t: 'text', str: 'write something here', font: 'type', size: 0.065, color: '#1d1c1a', align: 'center', style: 'plain', bg: '#f2c230', x: 0.5, y: R * 0.8, w: 0.82, rot: 0 }]; }],
    ['Two photos', function () { return [{ t: 'slot', x: 0.5, y: R * 0.27, w: 0.8, ar: 0.6, rot: -2 }, { t: 'slot', x: 0.5, y: R * 0.72, w: 0.8, ar: 0.6, rot: 2 }]; }],
    ['Collage', function () { return [{ t: 'slot', x: 0.36, y: R * 0.27, w: 0.56, ar: 0.8, rot: -5 }, { t: 'slot', x: 0.64, y: R * 0.53, w: 0.56, ar: 0.8, rot: 4 }, { t: 'slot', x: 0.4, y: R * 0.8, w: 0.5, ar: 0.7, rot: -3 }, { t: 'sticker', kind: 'tape', ar: 0.26, x: 0.36, y: R * 0.1, w: 0.36, rot: -8, color: '#1d1c1a' }, { t: 'sticker', kind: 'tape', ar: 0.26, x: 0.7, y: R * 0.37, w: 0.36, rot: 10, color: '#1d1c1a' }]; }],
    ['Big words', function () { return [{ t: 'text', str: 'BIG WORDS GO HERE', font: 'tall', size: 0.2, color: '#1d1c1a', align: 'left', style: 'plain', bg: '#f2c230', x: 0.5, y: R * 0.42, w: 0.86, rot: 0 }, { t: 'sticker', kind: 'squiggle', ar: 0.2, x: 0.45, y: R * 0.78, w: 0.6, rot: 0, color: '#c8412f' }]; }],
    ['Notes page', function () { return [{ t: 'text', str: 'Dear reader,\n\nwrite your story, a recipe, a list, a rant. Whatever is on your mind.', font: 'type', size: 0.06, color: '#1d1c1a', align: 'left', style: 'plain', bg: '#f2c230', x: 0.5, y: R * 0.4, w: 0.8, rot: 0 }]; }]
  ];
  var SHAPES = [['rect', 'Block', 0.62], ['circle', 'Circle', 1], ['scrap', 'Torn paper', 0.72], ['line', 'Line', 0.025]];

  // =========================================================
  // STATE + STORAGE
  // =========================================================
  var Z = null, images = {}, imgEls = {}, cur = 0, selId = null, step = 'make', tool = null;
  var hist = [], fut = [], drawing = null, ink = '#1d1c1a', pen = 0.008, safeGuide = true;
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function seed() { return Math.floor(Math.random() * 1e9); }
  function blankPage(i, n) { return { id: uid(), bg: i === 0 ? '#f6eedb' : '#ffffff', tex: 'none', els: [] }; }
  function newZine(fmt, count) {
    var n = fmt === 'mini' ? 8 : count || 8, z = { v: 3, title: 'Untitled', num: '001', by: '', fmt: fmt, pages: [] };
    for (var i = 0; i < n; i++) z.pages.push(blankPage(i, n));
    z.pages[0].els.push({ id: uid(), t: 'text', str: 'UNTITLED', font: 'tall', size: 0.24, color: '#1d1c1a', align: 'center', style: 'plain', bg: '#f2c230', x: 0.5, y: R * 0.38, w: 0.86, rot: -2, seed: seed() });
    z.pages[0].els.push({ id: uid(), t: 'sticker', kind: 'stamp', label: 'ISSUE 001', color: '#c8412f', x: 0.68, y: R * 0.72, w: 0.46, ar: 0.42, rot: 6, seed: seed() });
    z.pages[n - 1].els.push({ id: uid(), t: 'sticker', kind: 'stamp', label: 'PASS IT ON', color: '#1d1c1a', x: 0.5, y: R * 0.45, w: 0.56, ar: 0.42, rot: -4, seed: seed() });
    z.pages[n - 1].els.push({ id: uid(), t: 'text', str: 'made at nociv.co', font: 'type', size: 0.055, color: '#1d1c1a', align: 'center', style: 'plain', bg: '#f2c230', x: 0.5, y: R * 0.62, w: 0.8, rot: 0, seed: seed() });
    return z;
  }
  var db = null;
  function idbOpen() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open('nocivZine', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { db = r.result; res(db); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function idbGet(k) { return new Promise(function (res) { if (!db) return res(null); try { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } }); }
  function idbSet(k, v) { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }
  function idbClear() { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').clear(); } catch (e) {} }
