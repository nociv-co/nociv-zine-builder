<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOCIV // Zine Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Permanent+Marker&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f0f12] text-zinc-200 min-h-screen flex flex-col font-sans">

  <!-- Header Bar -->
  <header class="bg-[#141419] border-b border-zinc-800 p-3 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="bg-amber-400 text-black px-2 py-1 font-mono font-bold text-xs rounded">NOCIV</span>
      <h1 class="text-sm font-mono font-semibold">Zine Builder & Imposition Engine</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-save" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-mono px-3 py-1.5 rounded">Save Project</button>
      <button id="btn-export" class="bg-amber-400 hover:bg-amber-300 text-black font-bold text-xs font-mono px-3 py-1.5 rounded">Export Print PDF</button>
    </div>
  </header>

  <!-- Workspace Area -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Controls Panel -->
    <aside id="controls" class="w-80 bg-[#141419] border-r border-zinc-800 p-4 space-y-6 overflow-y-auto">
      <div>
        <label class="block text-xs font-mono font-bold text-amber-400 mb-2">1. Layout Preset</label>
        <select id="preset-select" class="w-full bg-[#0b0b0d] border border-zinc-800 text-xs font-mono p-2 rounded text-white">
          <option value="mini-8">8-Page Micro Zine (1 Sheet, Slit Cut)</option>
          <option value="accordion-6">6-Panel Accordion</option>
          <option value="saddle-8">8-Page Saddle Stitch</option>
        </select>
      </div>

      <div class="border-t border-zinc-800 pt-4">
        <label class="block text-xs font-mono font-bold text-amber-400 mb-2">2. Page Workbench</label>
        <div id="page-grid" class="grid grid-cols-4 gap-1.5 font-mono text-xs"></div>
      </div>

      <div class="border-t border-zinc-800 pt-4 space-y-3">
        <label class="block text-xs font-mono font-bold text-amber-400">3. Text & Content</label>
        <input type="text" id="page-text-input" placeholder="Page Title..." class="w-full bg-[#0b0b0d] border border-zinc-800 p-2 text-xs font-mono rounded text-white">
        <button id="btn-add-text" class="w-full bg-zinc-800 hover:bg-zinc-700 text-xs font-mono p-2 rounded">Update Page Text</button>
      </div>
    </aside>

    <!-- Center Canvas Preview -->
    <main id="preview-viewport" class="flex-1 bg-[#0a0a0c] p-6 flex items-center justify-center overflow-auto">
      <div id="canvas-container" class="shadow-2xl"></div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
